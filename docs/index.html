<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>垂直農場排程系統</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>垂直農場排程系統</h1>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="schedule">排程計算</button>
    <button class="tab-btn" data-tab="kanban">派工看板</button>
  </nav>

  <main>
    <!-- SC-01 排程計算 -->
    <section id="schedule" class="tab-content active">
      <h2>訂單倒排排程</h2>

      <form id="schedule-form" class="schedule-form">
        <div class="form-group">
          <label for="crop-select">菜種</label>
          <select id="crop-select">
            <option value="butter">奶油萵苣</option>
            <option value="romaine">蘿蔓生菜</option>
            <option value="arugula">芝麻葉</option>
            <option value="pakchoi">小白菜</option>
          </select>
        </div>
        <div class="form-group">
          <label for="weight">重量 (kg)</label>
          <input type="number" id="weight" placeholder="例：10" min="1" />
        </div>
        <div class="form-group">
          <label for="delivery-date">交貨日期</label>
          <input type="date" id="delivery-date" />
        </div>
        <div class="form-group form-btn">
          <button type="submit">計算排程</button>
        </div>
      </form>

      <div id="error-msg" class="error-msg hidden">⚠ 交期已過，請重新確認</div>

      <div id="result-table"></div>

      <div id="gantt-container">
        <svg id="gantt-svg" width="100%"></svg>
      </div>
    </section>

    <!-- SC-04 派工看板 -->
    <section id="kanban" class="tab-content">
      <h2>今日派工看板</h2>
      <div id="progress-bar" class="progress-bar">
        已完成 <span id="done-count">0</span>／<span id="total-count">0</span> 項
      </div>
      <div id="task-list" class="task-list"></div>
    </section>
  </main>

  <footer>
    <p>© 垂直農場排程系統 v1.0</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
